[package]
name = "revenant-core"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "revenant-core"
path = "src/main.rs"

[lib]
name = "revenant_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
